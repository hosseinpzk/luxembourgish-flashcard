name: Deploy Luxembourgish Flashcards

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sync_lod:
        description: "Refresh LOD data before deploying"
        required: false
        type: boolean
        default: true
  schedule:
    # Weekly LOD refresh: Sunday 03:17 UTC.
    - cron: "17 3 * * 0"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Avoid re-crawling LOD for ordinary code/CSS pushes.
      # Scheduled runs always refresh; manual runs refresh by default.
      - name: Refresh official LOD data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_lod)
        run: npm run sync:lod

      - name: Build Vite site
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
